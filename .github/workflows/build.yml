name: Build Elara Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tìm thư mục chứa build.gradle
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path '*/build/*' | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Tạo Gradle wrapper 8.10
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.10

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: elara-client
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
